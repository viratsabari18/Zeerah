name: zeerah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  flutter_card_swiper: ^7.2.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  provider: ^6.1.5+1
  intl: ^0.20.1
  geocoding: ^4.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  file_picker: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  card_swiper: ^3.0.1
flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/


  fonts:
  - family: Inter
    fonts:
      - asset: lib/assets/fonts/Inter-Light.ttf
        weight: 300
      - asset: lib/assets/fonts/Inter-Medium.ttf
        weight: 500
      - asset: lib/assets/fonts/Inter-SemiBold.ttf
        weight: 600
      - asset: lib/assets/fonts/Inter-Bold.ttf
        weight: 700